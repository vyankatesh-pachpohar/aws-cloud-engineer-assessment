# Local development stack.
# From repo root:  docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-orders}
      POSTGRES_USER: ${DB_USER:-orders}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-orders} -d ${DB_NAME:-orders}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"        # only for local psql access; never exposed in AWS

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: order-api:local
    environment:
      APP_ENV: local
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-orders}
      DB_USER: ${DB_USER:-orders}
      DB_PASSWORD: ${DB_PASSWORD}   # from .env locally; from Secrets Manager on ECS
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy   # api starts only after Postgres accepts conns
    restart: unless-stopped

volumes:
  pgdata:
