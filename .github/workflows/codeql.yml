# .github/workflows/codeql.yml
# CodeQL is GitHub's semantic code-analysis engine. Unlike lint (pattern
# matching) it builds a database of the code and runs queries over it —
# catches things like "value from HTTP request reaches an eval() sink".
# Results show up in the repo's Security > Code scanning tab.
#
# Runs on PRs, on push to main, and on a weekly schedule (catches new
# rules landing without a code change).

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 3 * * 1'         # every Monday 03:30 UTC

permissions:
  actions: read
  contents: read
  security-events: write         # required to upload SARIF to the Security tab

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
