# .github/workflows/deploy.yml
# On push to main OR manual dispatch:
#   1. Skip cleanly if AWS_ROLE_ARN isn't set yet.
#   2. Build the container image, push to ECR (tag = commit SHA + latest).
#   3. terraform apply with the real image tag.
#   4. Register a new ECS task definition + roll out (the ECS service ignores
#      task_definition changes in Terraform, so CD manages that separately).
#   5. Wait for ECS to stabilise.
#   6. Smoke-test /health on the ALB.
#
# Rollback: ECS deployment circuit breaker (configured in the module) rolls
# back to the previous task definition automatically on failure.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Override image tag (default = commit SHA)'
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  # ------- precheck: skip if GH Actions vars aren't set -------
  precheck:
    name: Check deploy prerequisites
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        run: |
          if [ -z "${{ vars.AWS_ROLE_ARN }}" ]; then
            echo "AWS_ROLE_ARN repository variable is not set."
            echo "Skipping deploy - configure it once you've run the AWS bootstrap."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "AWS_ROLE_ARN is set - proceeding with deploy."
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

  # ------- real deploy job -------
  deploy:
    name: Build, push, apply, smoke-test
    runs-on: ubuntu-latest
    needs: precheck
    if: needs.precheck.outputs.should_deploy == 'true'
    environment: dev
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      IMAGE_TAG:  ${{ github.event.inputs.image_tag || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO:     ${{ vars.ECR_REPO_NAME }}
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/$REPO:$IMAGE_TAG"
          docker buildx build \
            -f docker/Dockerfile \
            -t "$IMAGE" \
            -t "$REGISTRY/$REPO:latest" \
            --push .
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "::notice title=Image pushed::$IMAGE"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false

      - name: terraform init
        working-directory: terraform/environments/dev
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: terraform plan (deploy)
        id: tfplan
        working-directory: terraform/environments/dev
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -detailed-exitcode -out=tfplan.bin \
            -var="container_image_tag=$IMAGE_TAG" \
            -var="github_org=${{ github.repository_owner }}" \
            -var="github_repo=${{ github.event.repository.name }}" \
            -var="tf_state_bucket=${{ vars.TF_STATE_BUCKET }}" \
            -var="tf_lock_table=${{ vars.TF_LOCK_TABLE }}" \
            -var='alert_emails=${{ vars.ALERT_EMAILS_JSON }}' \
            2>&1 | tee plan.txt || TF_EXIT=$?
          TF_EXIT=${TF_EXIT:-0}
          if [ "$TF_EXIT" = "1" ]; then exit 1; fi

      - name: Render plan into summary
        if: always()
        working-directory: terraform/environments/dev
        run: |
          {
            echo "## Terraform plan"
            echo '```hcl'
            [ -f plan.txt ] && tail -c 60000 plan.txt || echo "no plan"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: terraform apply (only saved plan)
        working-directory: terraform/environments/dev
        run: |
          # apply the exact plan we just captured - no drift between plan and apply
          terraform apply -input=false -auto-approve tfplan.bin

      - name: Register new ECS task definition + update service
        working-directory: terraform/environments/dev
        run: |
          set -euo pipefail
          CLUSTER=$(terraform output -raw ecs_cluster)
          SERVICE=$(terraform output -raw ecs_service)
          IMAGE="${{ steps.build.outputs.image }}"

          TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0].taskDefinition' --output text)

          aws ecs describe-task-definition --task-definition "$TASK_DEF_ARN" \
            --query 'taskDefinition' > td.json

          # Swap the image, clear the read-only fields that would be rejected
          # on re-registration, and drop any bootstrap `command` override so
          # the real app uses its Dockerfile CMD.
          jq --arg IMG "$IMAGE" '
            .containerDefinitions[0].image = $IMG
            | del(.containerDefinitions[0].command)
            | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.deregisteredAt,
                  .compatibilities,.registeredAt,.registeredBy)
          ' td.json > td-new.json

          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://td-new.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          echo "::notice title=Task def registered::$NEW_ARN"

          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" \
            --task-definition "$NEW_ARN" --force-new-deployment >/dev/null

          echo "Waiting for service to stabilize..."
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"

      - name: Smoke test
        working-directory: terraform/environments/dev
        run: |
          set -euo pipefail
          URL="http://$(terraform output -raw alb_dns_name)"
          echo "Testing $URL/health"
          for i in $(seq 1 20); do
            code=$(curl -s -o /tmp/body -w '%{http_code}' "$URL/health" || echo "000")
            if [ "$code" = "200" ]; then
              echo "::notice title=Smoke test OK::$URL/health returned 200"
              cat /tmp/body
              exit 0
            fi
            echo "attempt $i: HTTP $code"
            sleep 6
          done
          echo "::error::Smoke test FAILED - ECS circuit breaker should auto-rollback."
          exit 1
