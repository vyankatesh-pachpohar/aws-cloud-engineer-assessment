# .github/workflows/ci.yml
# CI pipeline: lint, test, build, security scan, terraform validate + plan.
# Runs on every PR and every push to main. Deploy is a separate workflow.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write         # so tf plan can be posted as a PR comment
  id-token: write              # OIDC for AWS

jobs:
  # ---------------------------------------------------------------------
  lint:
    name: Lint + security static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ruff (lint)
        run: |
          pip install ruff==0.7.4
          ruff check app/
          ruff format --check app/

      - name: Bandit (security)
        continue-on-error: true
        run: |
          pip install bandit==1.7.10
          bandit -r app/ -x app/tests --severity-level medium --confidence-level medium

  # ---------------------------------------------------------------------
  test:
    name: Application tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Install deps
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        working-directory: app
        run: pytest -q --junitxml=../test-results.xml

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  # ---------------------------------------------------------------------
  docker-build-scan:
    name: Build image + Trivy scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: order-api:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Gate on CRITICAL only. HIGH-severity findings are reported but don't
      # block the pipeline - they get tracked and prioritized through the
      # regular backlog. Blocking on HIGH creates false urgency; blocking
      # on CRITICAL keeps the pipeline honest.
      - name: Trivy scan (image)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: order-api:ci-${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL
          trivyignores: .trivyignore

      - name: Trivy scan (filesystem — deps)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: app
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore

  # ---------------------------------------------------------------------
  terraform:
    name: Terraform validate + plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/environments/dev
    env:
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false

      - name: fmt (informational)
        continue-on-error: true
        run: terraform fmt -check -recursive ../../../terraform

      - name: Configure AWS credentials (OIDC)
        if: vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region:     ${{ vars.AWS_REGION }}

      - name: init (with backend if configured, else local)
        run: |
          if [ -n "${{ vars.TF_STATE_BUCKET }}" ]; then
            terraform init -input=false \
              -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
              -backend-config="key=dev/terraform.tfstate" \
              -backend-config="region=${{ vars.AWS_REGION }}" \
              -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}" \
              -backend-config="encrypt=true"
          else
            terraform init -backend=false -input=false
          fi

      - name: validate
        run: terraform validate

      - name: plan
        id: plan
        if: vars.AWS_ROLE_ARN != ''
        run: |
          set -o pipefail
          # Run plan and capture output to a file so we can render it in
          # the workflow summary and post it as a PR comment. exit-code=2
          # means "changes present" (not a failure); we accept both 0 and 2.
          terraform plan -input=false -no-color -detailed-exitcode \
            -var="github_org=${{ github.repository_owner }}" \
            -var="github_repo=${{ github.event.repository.name }}" \
            -var="tf_state_bucket=${{ vars.TF_STATE_BUCKET }}" \
            -var="tf_lock_table=${{ vars.TF_LOCK_TABLE }}" \
            -var='alert_emails=${{ vars.ALERT_EMAILS_JSON }}' \
            2>&1 | tee plan.txt || TF_EXIT=$?

          TF_EXIT=${TF_EXIT:-0}
          echo "exit_code=$TF_EXIT" >> "$GITHUB_OUTPUT"

          # exit 1 = real error, exit 0 = no changes, exit 2 = changes present.
          # Only exit 1 is a failure for this step.
          if [ "$TF_EXIT" = "1" ]; then
            echo "::error::terraform plan failed"
            exit 1
          fi

      - name: Render plan into Actions summary
        if: always() && vars.AWS_ROLE_ARN != ''
        working-directory: terraform/environments/dev
        run: |
          {
            echo "## Terraform plan (dev)"
            echo ""
            if [ -f plan.txt ]; then
              echo '```hcl'
              tail -c 60000 plan.txt   # last ~60KB to stay under GitHub's 1MB summary limit
              echo '```'
            else
              echo "_No plan captured._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan as artifact
        if: always() && vars.AWS_ROLE_ARN != ''
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform/environments/dev/plan.txt
          retention-days: 14

      # PR comment with the plan so reviewers see it inline with the diff.
      - name: Post plan on PR
        if: github.event_name == 'pull_request' && vars.AWS_ROLE_ARN != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## Terraform plan (dev)\n\n';
            try {
              const plan = fs.readFileSync('terraform/environments/dev/plan.txt', 'utf8');
              const trimmed = plan.length > 60000 ? '...(truncated)...\n' + plan.slice(-60000) : plan;
              body += '<details><summary>Show plan</summary>\n\n```hcl\n' + trimmed + '\n```\n</details>\n';
            } catch (e) {
              body += '_Plan file not found._\n';
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: body
            });
