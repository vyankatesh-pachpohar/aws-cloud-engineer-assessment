# .github/workflows/ci.yml
# CI pipeline: test, build, security scan, terraform validate & plan.
# Runs on every PR and every push to main. Deploy is a separate workflow.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  id-token: write             # OIDC for AWS

jobs:
  # ---------------------------------------------------------------------
  lint:
    name: Lint + security static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Ruff — Python linter + formatter check. Extremely fast, covers
      # pycodestyle, pyflakes, isort, bugbear, and many more. Fails the
      # step on any lint error; adjust config in pyproject.toml if you
      # want a subset.
      - name: Ruff (lint)
        run: |
          pip install ruff==0.7.4
          ruff check app/
          ruff format --check app/

      # Bandit — Python security linter. Looks for common vuln patterns:
      # eval(), assert-in-production, weak crypto, hardcoded secrets, SQL
      # concat, subprocess=shell=True, etc. Fail-soft (issues reported but
      # don't gate) so a false positive doesn't block a deploy — we track
      # findings and fix, we don't stampede.
      - name: Bandit (security)
        continue-on-error: true
        run: |
          pip install bandit==1.7.10
          bandit -r app/ -x app/tests --severity-level medium --confidence-level medium

  # ---------------------------------------------------------------------
  test:
    name: Application tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Install deps
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        working-directory: app
        run: pytest -q --junitxml=../test-results.xml

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  # ---------------------------------------------------------------------
  docker-build-scan:
    name: Build image + Trivy scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: order-api:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Gate on CRITICAL only. HIGH-severity findings are reported but don't
      # block the pipeline — they get tracked and prioritized through the
      # regular backlog. Blocking on HIGH creates a false urgency that
      # pushes teams to bypass security scans; blocking on CRITICAL keeps
      # the pipeline honest for issues that genuinely warrant stopping.
      # See .trivyignore at repo root for time-boxed suppressions.
      - name: Trivy scan (image)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: order-api:ci-${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL
          trivyignores: .trivyignore

      - name: Trivy scan (filesystem — deps)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: app
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore

  # ---------------------------------------------------------------------
  terraform:
    name: Terraform validate + plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/environments/dev
    env:
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      # Informational only — `terraform fmt` catches whitespace differences,
      # which don't affect correctness. Fix locally with:
      #   terraform fmt -recursive terraform/
      - name: fmt (informational)
        continue-on-error: true
        run: terraform fmt -check -recursive ../../../terraform

      - name: Configure AWS credentials (OIDC)
        if: vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region:     ${{ vars.AWS_REGION }}

      - name: init (with backend if configured, else local)
        run: |
          if [ -n "${{ vars.TF_STATE_BUCKET }}" ]; then
            terraform init -input=false \
              -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
              -backend-config="key=dev/terraform.tfstate" \
              -backend-config="region=${{ vars.AWS_REGION }}" \
              -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}" \
              -backend-config="encrypt=true"
          else
            terraform init -backend=false -input=false
          fi

      - name: validate
        run: terraform validate

      - name: plan (only if AWS creds configured)
        if: vars.AWS_ROLE_ARN != ''
        run: |
          terraform plan -input=false -no-color \
            -var="github_org=${{ github.repository_owner }}" \
            -var="github_repo=${{ github.event.repository.name }}" \
            -var="tf_state_bucket=${{ vars.TF_STATE_BUCKET }}" \
            -var="tf_lock_table=${{ vars.TF_LOCK_TABLE }}"
